name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: survey
          POSTGRES_PASSWORD: survey
          POSTGRES_DB: survey_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U survey" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Database tests (*.db.test.ts) run only when this is set.
      TEST_DATABASE_URL: postgres://survey:survey@localhost:5432/survey_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t survey-host-poc:ci .
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: survey-host-poc:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
      - run: terraform -chdir=infra fmt -check
      - run: terraform -chdir=infra init -backend=false
      - run: terraform -chdir=infra validate
